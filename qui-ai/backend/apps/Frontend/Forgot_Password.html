<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style type="text/css">
        @font-face {
            font-family: 'Madani';
            src: url('./Fonts/Madani Arabic Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Madani';
            src: url('./Fonts/Madani Arabic Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Madani', sans-serif;
            background-color: black; /* Base background color */
            overflow-x: hidden;
            overflow-y: auto;
        }

        input,
        button,
        p,
        h1,
        h2,
        span,
        a,
        svg,
        i {
            font-family: 'Madani', sans-serif;
        }

        .fa-envelope,
        .fa-eye,
        .fa-eye-slash,
        .fa-user {
            height: 1.25rem;
            width: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .full-page-bg {
            min-height: 100vh;
            /* background-color: black; /* Redundant if body has it, but harmless */
            background-image:
                radial-gradient(at bottom right, #c74ece 0%, #3c0089 50%, transparent 70%);
            background-repeat: no-repeat;
            background-position: right bottom;
            background-size: 100% 100%; /* Consider if this stretch is desired, or 'cover'/'contain' */
            position: relative;
        }

        .top-header-gradient {
            position: absolute; /* Changed to absolute for better layout control with main content */
            top: 0;
            left: 0;
            width: 100%;
            height: 60px; /* Fixed height */
            background: linear-gradient(to right, #c74ece, #3c0089);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem; /* 24px padding left/right */
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const ForgotPasswordForm = () => {
            const [email, setEmail] = React.useState('');
            const [error, setError] = React.useState('');
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const [message, setMessage] = React.useState('');

            const emailRef = React.useRef(null);

            React.useEffect(() => {
                if (emailRef.current) {
                    emailRef.current.focus();
                }
            }, []); // Empty dependency array ensures this runs once on mount

            const validateEmail = (email) => {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            };

            const handleChange = (e) => {
                setEmail(e.target.value);
                if (error) setError(''); // Clear error when user starts typing
                if (message) setMessage(''); // Clear message when user starts typing
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit(e);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setMessage('');

                if (!email) {
                    setError('Please enter your email address.');
                    emailRef.current && emailRef.current.focus(); // Focus on error
                    return;
                }

                if (!validateEmail(email)) {
                    setError('Please enter a valid email address.');
                    emailRef.current && emailRef.current.focus(); // Focus on error
                    return;
                }

                setIsSubmitting(true);
                try {
                    // Simulate API Call
                    await new Promise(resolve => setTimeout(resolve, 1500)); 
                    
                    // On "success"
                    setMessage('Instructions to reset your password have been sent to your email. Please check your inbox (and spam folder).');
                    setEmail(''); // Clear the email field
                } catch (err) {
                    // On "failure"
                    setError('An unexpected error occurred while sending the email. Please try again later.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="full-page-bg relative flex flex-col items-center justify-center">

                    {/* Top Header with Gradient Background */}
                    <div className="top-header-gradient">
                        <span className="text-white text-3xl font-bold">QUI.Ai</span>
                        <div className="space-x-4">
                            <a
                                href="Login.html" // Ensure this filename is correct
                                className="bg-white text-[#c74ece] font-semibold py-2 px-6 rounded-full hover:bg-purple-100 transition duration-300"
                            >
                                LOGIN
                            </a>
                            <a
                                href="Sign Up Final.html" // Ensure this filename is correct
                                className="bg-[#c74ece] text-white font-semibold py-2 px-6 rounded-full border border-white hover:bg-[#b035dd] transition duration-300"
                            >
                                GET STARTED
                            </a>
                        </div>
                    </div>

                    {/* Main content wrapper - pushed down by the header height */}
                    <div className="flex flex-col items-center justify-center w-full max-w-md sm:max-w-lg lg:max-w-xl py-8" style={{ marginTop: '80px' }}> {/* Adjusted margin-top slightly for better spacing */}
                        <h1 className="text-white text-3xl font-bold mb-4 text-center">Forgot password</h1>
                        <p className="text-gray-300 text-center mb-8 px-4">We will send you instructions on how to reset your password by email.</p>

                        <div className="bg-white bg-opacity-10 p-8 rounded-lg w-full max-w-md">
                            <form onSubmit={handleSubmit} className="space-y-6"> {/* Changed to form tag and space-y-6 for better spacing */}
                                <div className="relative">
                                    <input
                                        ref={emailRef}
                                        type="email"
                                        name="email"
                                        value={email}
                                        onChange={handleChange}
                                        onKeyPress={handleKeyPress} // Can be removed if using form onSubmit
                                        placeholder="Enter your email address"
                                        className="w-full p-3 bg-white bg-opacity-20 text-white placeholder-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c74ece] pr-10" // Added pr-10 for icon space
                                        disabled={isSubmitting} // Disable input during submission
                                    />
                                    <span className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-300 pointer-events-none">
                                        <i className="fas fa-envelope"></i> {/* Tailwind classes for size defined in CSS */}
                                    </span>
                                </div>
                                
                                {error && <p className="text-red-400 text-sm text-center">{error}</p>}
                                {message && <p className="text-green-400 text-sm text-center">{message}</p>}
                                
                                <button
                                    type="submit" // Good practice for form button
                                    disabled={isSubmitting || (message && !error)} // Disable if submitting or if success message is shown
                                    className={`w-full py-3 bg-[#c74ece] text-white font-semibold rounded-lg transition-all duration-300 transform ${
                                        isSubmitting || (message && !error)
                                            ? 'scale-95 opacity-70 cursor-not-allowed' 
                                            : 'hover:scale-105 hover:bg-[#b035dd]'
                                    }`}
                                >
                                    {isSubmitting ? 'SENDING...' : 'SEND RESET LINK'}
                                </button>
                            </form>
                        </div>
                         <p className="text-gray-400 text-center text-sm mt-6">
                            Remember your password? <a href="Login.html" className="text-[#c74ece] hover:underline">Log in here</a>.
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ForgotPasswordForm />);
    </script>
</body>
</html>
