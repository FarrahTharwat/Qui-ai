<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUI.AI - MyProfile</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style type="text/css">
        /* ... All CSS remains the same ... */
        @font-face {
            font-family: 'Madani';
            src: url('./Fonts/Madani Arabic Regular.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Madani';
            src: url('./Fonts/Madani Arabic Bold.ttf') format('truetype');
            font-weight: bold;
        }

        body {
            font-family: 'Madani', sans-serif;
            background-color: black;
            overflow-x: hidden;
        }

        input,
        button,
        p,
        h1,
        h2,
        span,
        a,
        svg,
        div {
            font-family: 'Madani', sans-serif;
        }

        .fas,
        .fab {
            height: 1.25rem;
            width: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem !important;
            color: white !important;
            line-height: 1 !important;
            transition: color 0.2s ease-in-out;
        }

        .full-page-bg {
            min-height: 100vh;
            background-color: black;
            background-image: radial-gradient(at bottom right, #c74ece 0%, #3c0089 50%, transparent 70%);
            background-size: 200% 200%;
            background-position: 0% 0%;
            animation: moveGradient 15s ease infinite alternate;
            position: relative;
            overflow: hidden;
        }

        @keyframes moveGradient {
            0% {
                background-position: 0% 0%;
            }

            25% {
                background-position: 100% 0%;
            }

            50% {
                background-position: 100% 100%;
            }

            75% {
                background-position: 0% 100%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        .sidebar {
            background-color: #1a1a1a;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 15;
            width: 200px;
            flex-shrink: 0;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 2rem;
            display: flex;
            flex-direction: column;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            text-decoration: none;
        }

        .sidebar-item:hover {
            background-color: #2a2a2a;
        }

        .sidebar-item.active {
            background-color: #c74ece;
            color: white;
            border-top-right-radius: 9999px;
            border-bottom-right-radius: 9999px;
            padding-right: 2rem;
        }

        .sidebar-logo {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            padding: 0 1rem 1.5rem;
            display: block;
        }

        .card {
            background-color: #1c1c1c;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .card-header {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .all-achievements-container {
            background-color: #1c1c1c;
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: white;
            max-width: 600px;
            margin: 2rem auto;
        }

        .all-achievements-header {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .back-button {
            display: flex;
            align-items: center;
            background: none;
            border: none;
            color: #c74ece;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 1.5rem;
            padding: 0;
            transition: color 0.2s;
        }

        .back-button:hover {
            color: #b035dd;
        }

        .back-button i {
            margin-right: 0.5rem;
        }

        .friends-panel-item {
            display: flex;
            align-items: center;
            background-color: #1f1f1f;
            border-radius: 0.5rem;
            padding: 1rem;
            transition: background-color 0.2s ease-in-out;
            position: relative;
        }

        .friends-panel-item:hover {
            background-color: #2a2a2a;
        }

        .friends-panel-item i {
            font-size: 1.5rem !important;
            margin-right: 1rem;
        }

        .friends-panel-item .arrow-icon {
            margin-left: auto;
            font-size: 1rem !important;
            color: #888 !important;
        }

        .top-header {
            background-color: #1a1a1a;
            height: 60px;
            width: calc(100% - 200px);
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            color: white;
            gap: 1.5rem;
        }

        .header-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }

        .header-item:hover {
            background-color: #2a2a2a;
        }

        .header-item span {
            font-weight: bold;
            margin-left: 0.5rem;
            color: white;
        }

        .notification-badge {
            position: absolute;
            top: 0.25rem;
            right: 0.25rem;
            background-color: red;
            border-radius: 50%;
            width: 0.6rem;
            height: 0.6rem;
            display: block;
        }

        .dropdown-content {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background-color: #1c1c1c;
            border-radius: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            min-width: 250px;
            padding: 0.5rem;
            z-index: 20;
            display: none;
            flex-direction: column;
            white-space: nowrap;
        }

        .header-item:hover .dropdown-content {
            display: flex;
        }

        .dropdown-content.show {
            display: flex;
        }

        .dropdown-item {
            padding: 0.75rem 1rem;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 0.3rem;
            display: flex;
            align-items: center;
        }

        .dropdown-item:hover {
            background-color: #2a2a2a;
        }

        .dropdown-item i {
            margin-right: 0.75rem;
            font-size: 1rem !important;
        }

        .dropdown-item.active-course {
            background-color: #c74ece;
        }

        .dropdown-notifications {
            padding: 0.75rem 1rem;
            color: white;
            border-bottom: 1px solid #333;
        }

        .dropdown-notifications:last-of-type {
            border-bottom: none;
        }

        .dropdown-notifications button {
            background-color: #c74ece;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin-top: 0.75rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        // --- DATA ---
        const allAchievementsData = [{ id: 1, title: "Wildfire", description: "Reach a 3 day streak", progress: { current: 1, target: 3 }, icon: "fa-fire", iconColor: "bg-orange-500" }, { id: 2, title: "Sage", description: "Earn 2000 XP", progress: { current: 1076, target: 2000 }, icon: "fa-star", iconColor: "bg-yellow-500" }, { id: 3, title: "Scholar", description: "Learn 2000 new words", progress: { current: 1505, target: 2000 }, icon: "fa-book-open", iconColor: "bg-blue-500" }, { id: 4, title: "Champion", description: "Advance to Diamond League", progress: { current: 0, target: 1 }, icon: "fa-gem", iconColor: "bg-cyan-500" }, { id: 5, title: "Sharpshooter", description: "Complete 100 lessons with no mistakes", progress: { current: 14, target: 100 }, icon: "fa-bullseye", iconColor: "bg-green-500" }, { id: 6, title: "Winner", description: "Finish #1 on leaderboard", progress: { current: 0, target: 1 }, icon: "fa-crown", iconColor: "bg-purple-500" }, { id: 7, title: "Friendly", description: "Follow 3 friends", progress: { current: 1, target: 3 }, icon: "fa-users", iconColor: "bg-pink-500" }, { id: 8, title: "Weekend Warrior", description: "Complete a lesson on Sat/Sun", progress: { current: 0, target: 2 }, icon: "fa-calendar-week", iconColor: "bg-teal-500" }, { id: 9, title: "Photogenic", description: "Add a profile picture", progress: { current: 0, target: 1 }, icon: "fa-camera-retro", iconColor: "bg-indigo-500" }];

        // --- SUB-COMPONENTS ---
        const Sidebar = () => { const handleLogout = (e) => { e.preventDefault(); localStorage.removeItem('Q.Ai_userData'); window.location.href = 'Login.html'; }; const sidebarItems = [{ icon: 'fa-graduation-cap', text: 'LEARN', link: 'HomePage.html', active: false }, { icon: 'fa-upload', text: 'USER UPLOADS', link: '#', active: false }, { icon: 'fa-trophy', text: 'LEADERBOARDS', link: 'Leaderboards.html', active: false }, { icon: 'fa-user', text: 'PROFILE', link: 'MyProfile.html', active: true },]; return (<div className="sidebar"> <a href="HomePage.html" className="sidebar-logo">QUI.AI</a> <div> {sidebarItems.map(item => (<a key={item.text} href={item.link} className={`sidebar-item ${item.active ? 'active' : ''}`}> <i className={`fas ${item.icon} mr-3`}></i> <span className="text-lg font-semibold">{item.text}</span> </a>))} </div> <div className="relative group mt-auto mb-2"> <div className="sidebar-item"> <i className="fas fa-ellipsis-h mr-3"></i> <span className="text-lg font-semibold">MORE</span> </div> <div className="absolute bottom-full left-0 mb-2 w-[190px] bg-[#2a2a2a] rounded-lg shadow-lg hidden group-hover:block transition-all duration-300 opacity-0 group-hover:opacity-100"> <button onClick={handleLogout} className="w-full text-left flex items-center text-white px-4 py-3 hover:bg-red-600 rounded-lg"> <i className="fas fa-sign-out-alt mr-3"></i> Log Out </button> </div> </div> </div>); };
        const TopHeader = ({ dayStreak, currentCourse, onNotificationClick, showNotifications, notifications, onReadAllNotifications, onCourseChange }) => { const courses = [{ id: 1, name: "Computer Vision", icon: "fa-eye" }, { id: 2, name: "Cloud", icon: "fa-cloud" }, { id: 3, name: "Deep Learning", icon: "fa-layer-group" }, { id: 4, name: "Machine Learning", icon: "fa-cogs" }, { id: 5, name: "NLP", icon: "fa-comment-dots" }, { id: 6, name: "Neural Networks", icon: "fa-brain" }, { id: 7, name: "Robotics", icon: "fa-robot" },]; return (<div className="top-header"> <div className="header-item"> <i className="fas fa-fire text-orange-400"></i> <span>{dayStreak}</span> </div> <div className="header-item group"> <i className="fas fa-flag"></i> <span>{currentCourse}</span> <div className="dropdown-content group-hover:flex"> {courses.map(course => (<div key={course.id} onClick={() => onCourseChange(course.name)} className={`dropdown-item ${course.name === currentCourse ? 'active-course' : ''}`}> <i className={`fas ${course.icon}`}></i> {course.name} </div>))} </div> </div> <div className="header-item" onClick={onNotificationClick}> <i className="fas fa-bell"></i> {notifications && notifications.length > 0 && <span className="notification-badge"></span>} <div className={`dropdown-content ${showNotifications ? 'show' : ''}`} onClick={e => e.stopPropagation()}> {notifications && notifications.length > 0 ? (<> {notifications.map(notif => (<div key={notif.id} className="dropdown-notifications text-sm mb-1">{notif.message}</div>))} <button onClick={onReadAllNotifications}>Read All</button> </>) : (<div className="dropdown-notifications text-center text-gray-400">No new notifications</div>)} </div> </div> </div>); };
        const ProfileHeader = ({ username, joinDate, following, followers, avatar, onAvatarUpload }) => (<div className="card flex flex-col sm:flex-row items-center sm:items-start p-6 bg-gray-900 border border-gray-700"> <div className="relative w-28 h-28 rounded-full overflow-hidden mr-0 sm:mr-6 mb-4 sm:mb-0 flex-shrink-0 group"> {avatar ? (<img src={avatar} alt="Profile Avatar" className="w-full h-full object-cover" />) : (<div className="w-full h-full bg-gray-700 flex items-center justify-center"> <i className="fas fa-user-circle text-gray-400 text-6xl"></i> </div>)} <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 cursor-pointer" onClick={onAvatarUpload}> <i className="fas fa-camera text-white text-2xl"></i> </div> </div> <div className="flex-grow flex flex-col items-center sm:items-start mt-4 sm:mt-0"> <h1 className="text-3xl font-bold text-white mb-2">{username}</h1> <p className="text-gray-300 text-sm">Joined {joinDate}</p> <p className="text-gray-300 text-sm">{following} Following / {followers} Followers</p> </div> </div>);
        const StatisticsCard = ({ stats }) => (<div className="card h-full"> <h2 className="card-header text-white">Statistics</h2> <div className="grid grid-cols-2 gap-4"> {stats.map((stat, index) => (<div key={index} className="flex items-center p-4 bg-gray-800 rounded-lg"> <div className={`stat-icon ${stat.iconColor}`}> <i className={`fas ${stat.icon}`}></i> </div> <div> <p className="text-white text-2xl font-bold">{stat.value}</p> <p className="text-gray-400 text-sm">{stat.label}</p> </div> </div>))} </div> </div>);
        const AchievementCard = ({ title, description, progress, icon, iconColor }) => { const percentage = progress && progress.target > 0 ? (progress.current / progress.target) * 100 : 0; return (<div className="flex items-center p-4 bg-gray-800 rounded-lg mb-4"> <div className={`stat-icon ${iconColor}`}> <i className={`fas ${icon}`}></i> </div> <div className="flex-grow"> <h3 className="text-white font-bold">{title}</h3> <p className="text-gray-400 text-sm mb-1">{description}</p> <div className="w-full bg-gray-700 rounded-full h-2"> <div className={`h-2 rounded-full ${iconColor}`} style={{ width: `${percentage}%` }}></div> </div> <p className="text-gray-500 text-xs mt-1">{progress.current}/{progress.target}</p> </div> </div>); };
        const AllAchievementsPage = ({ onBackToProfile }) => { const sidebarWidth = '200px'; return (<div className="flex flex-col flex-grow px-8 py-8" style={{ marginLeft: sidebarWidth, marginTop: '60px' }}> <div className="all-achievements-container"> <button onClick={onBackToProfile} className="back-button"> <i className="fas fa-arrow-left"></i> Back to Profile </button> <h1 className="all-achievements-header">All Achievements</h1> {allAchievementsData.map((achievement) => (<AchievementCard key={achievement.id} {...achievement} />))} </div> </div>); };
        const InviteFriendsModal = ({ isOpen, onClose }) => { if (!isOpen) return null; const [copyButtonText, setCopyButtonText] = React.useState("COPY LINK"); const inviteLink = "https://invite.q-ai.com/BDHTZTB5C"; const handleCopyLink = () => { navigator.clipboard.writeText(inviteLink).then(() => { setCopyButtonText("COPIED!"); setTimeout(() => setCopyButtonText("COPY LINK"), 2000); }).catch(err => console.error('Failed to copy: ', err)); }; return (<div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50" onClick={onClose}> <div className="bg-[#1c1c1c] rounded-2xl p-8 max-w-sm w-full relative" onClick={e => e.stopPropagation()}> <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-white"> <i className="fas fa-times"></i> </button> <div className="text-center"> <img src="images/logo-robot-01.png" alt="QUI.AI Robot" className="w-32 h-32 mx-auto mb-4" /> <h2 className="text-2xl font-bold text-white mb-2">Invite friends</h2> <p className="text-gray-300 mb-6">Tell your friends it's free and fun to learn about AI on QUI.AI!</p> <div className="flex bg-gray-800 rounded-lg p-1"> <input type="text" readOnly value={inviteLink} className="bg-transparent text-white flex-grow p-2 outline-none" /> <button onClick={handleCopyLink} className="bg-[#c74ece] font-bold text-white px-4 py-2 rounded-md hover:bg-[#b035dd] transition-colors">{copyButtonText}</button> </div> </div> </div> </div>); };
        const FindUsersPage = ({ onBackToProfile }) => { const sidebarWidth = '200px'; return (<div className="flex flex-col flex-grow px-8 py-8" style={{ marginLeft: sidebarWidth, marginTop: '60px' }}> <button onClick={onBackToProfile} className="back-button self-start"> <i className="fas fa-arrow-left"></i> Back to Profile </button> <div className="w-full max-w-xl mx-auto text-center"> <h1 className="text-3xl font-bold text-white mb-6">Search for users</h1> <div className="relative"> <input type="text" placeholder="Name or username" className="w-full p-4 pl-12 bg-[#1c1c1c] text-white border-2 border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c74ece] text-lg" /> <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400"> <i className="fas fa-search"></i> </span> </div> <img src="images/logo-robot-01.png" alt="QUI.AI Robot" className="w-48 h-48 mx-auto mt-8" /> <p className="text-gray-300 text-lg mt-4">Learning is more fun and effective when you connect with others.</p> </div> </div>); };
        const FriendsPanel = ({ following, followers, onFindUsersClick, onInviteFriendsClick }) => { const [activeTab, setActiveTab] = React.useState('following'); return (<div className="card sticky top-20"> <div className="flex border-b border-gray-700 mb-4"> <button onClick={() => setActiveTab('following')} className={`flex-1 text-center font-bold py-2 transition-colors ${activeTab === 'following' ? 'text-white border-b-2 border-[#c74ece]' : 'text-gray-400'}`}> FOLLOWING {following} </button> <button onClick={() => setActiveTab('followers')} className={`flex-1 text-center font-bold py-2 transition-colors ${activeTab === 'followers' ? 'text-white border-b-2 border-[#c74ece]' : 'text-gray-400'}`}> FOLLOWERS {followers} </button> </div> <div className="text-center text-gray-400 py-8"> {activeTab === 'following' ? "You aren't following anyone yet." : "You don't have any followers yet."} </div> <hr className="border-gray-700 my-4" /> <div className="space-y-3"> <div onClick={onFindUsersClick} className="friends-panel-item cursor-pointer"> <i className="fas fa-search text-white mr-4"></i> <div> <h3 className="text-white font-bold">Find Users</h3> <p className="text-gray-400 text-sm">Look for other learners.</p> </div> <i className="fas fa-chevron-right arrow-icon"></i> </div> <div onClick={onInviteFriendsClick} className="friends-panel-item cursor-pointer"> <i className="fas fa-user-plus text-white mr-4"></i> <div> <h3 className="text-white font-bold">Invite friends</h3> <p className="text-gray-400 text-sm">Earn rewards by inviting new users.</p> </div> <i className="fas fa-chevron-right arrow-icon"></i> </div> </div> </div>); };

        const ProfilePage = () => {
            const [userData, setUserData] = React.useState(null);
            const [activeView, setActiveView] = React.useState('profile');
            const [isInviteModalOpen, setInviteModalOpen] = React.useState(false);
            const [showNotifications, setShowNotifications] = React.useState(false);
            
        const fetchAchievements = async (userId) => {
            try {
                const response = await fetch('http://localhost:8003/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: userId })
                });

                const result = await response.json();
                if (response.ok) {
                    console.log("✅ Unlocked Achievements:", result.unlocked);

                    setUserData(prev => ({
                        ...prev,
                        achievements: result.unlocked.map(title => ({
                            id: title,
                            title,
                            description: "Unlocked via XP system",
                            progress: { current: 1, target: 1 },
                            icon: "fa-trophy",
                            iconColor: "bg-purple-500"
                        }))
                    }));
                } else {
                    console.error("❌ Failed to fetch achievements:", result);
                }
            } catch (err) {
                console.error("🚨 Error calling achievements service:", err);
            }
        };

        React.useEffect(() => { const fetchUserData = () => { let userObject = null; try { const storedUserData = localStorage.getItem('Q.Ai_userData'); if (storedUserData) { const parsedData = JSON.parse(storedUserData); if (parsedData && parsedData.profile && parsedData.achievements) { userObject = parsedData; } } } catch (error) { console.error("Failed to load or parse user data:", error); localStorage.removeItem('Q.Ai_userData'); } if (!userObject) { userObject = { profile: { username: "Fouad El Sabbagh", joinDate: "February 2023", following: 12, followers: 5, avatarUrl: "" }, stats: { dayStreak: 5, totalXp: 1076, currentLeague: "Ruby", top3Finishes: 2 }, achievements: allAchievementsData, notifications: [{ id: 1, message: "Peter Griffin followed you!" }, { id: 2, message: "Your 'Intro to AI' PDF is ready!" }], currentCourse: "Neural Networks" }; localStorage.setItem('Q.Ai_userData', JSON.stringify(userObject)); } setUserData(userObject); }; fetchUserData(); }, []);
            const fileInputRef = React.useRef(null);
            const handleAvatarUploadClick = () => { fileInputRef.current.click(); };
            const handleFileChange = (event) => { const file = event.target.files[0]; if (!file) return; const formData = new FormData(); formData.append('avatar', file); const reader = new FileReader(); reader.onloadend = () => { const localPreviewUrl = reader.result; setUserData(prevData => ({ ...prevData, profile: { ...prevData.profile, avatarUrl: localPreviewUrl } })); }; reader.readAsDataURL(file); };
            const handleNotificationClick = () => { setShowNotifications(!showNotifications); };
            const handleReadAllNotifications = (e) => { e.stopPropagation(); setUserData(prevData => { const updatedData = { ...prevData, notifications: [] }; localStorage.setItem('Q.Ai_userData', JSON.stringify(updatedData)); return updatedData; }); setShowNotifications(false); };
            const handleCourseChange = (newCourseName) => { setUserData(prevData => { const updatedData = { ...prevData, currentCourse: newCourseName }; localStorage.setItem('Q.Ai_userData', JSON.stringify(updatedData)); return updatedData; }); };
            if (!userData) { return (<div className="full-page-bg flex items-center justify-center"> <h1 className="text-white text-2xl">Loading Profile...</h1> </div>); }
            const renderContent = () => {
                switch (activeView) {
                    case 'allAchievements': return <AllAchievementsPage onBackToProfile={() => setActiveView('profile')} />;
                    case 'findUsers': return <FindUsersPage onBackToProfile={() => setActiveView('profile')} />;
                    case 'profile':
                    default:
                        const profileHeaderProps = { ...userData.profile, avatar: userData.profile.avatarUrl, onAvatarUpload: handleAvatarUploadClick };
                        const statsCardProps = { stats: [{ value: userData.stats.dayStreak, label: "Day streak", icon: "fa-fire", iconColor: "bg-orange-500" }, { value: userData.stats.totalXp, label: "Total XP", icon: "fa-star", iconColor: "bg-yellow-500" }, { value: userData.stats.currentLeague, label: "Current league", icon: "fa-gem", iconColor: "bg-red-500" }, { value: userData.stats.top3Finishes, label: "Top 3 finishes", icon: "fa-trophy", iconColor: "bg-gray-500" },] };
                        const featuredAchievements = Array.isArray(userData.achievements) ? userData.achievements.slice(0, 3) : [];
                        return (<main className="w-full" style={{ marginLeft: '200px' }}> <div className="flex-grow flex flex-col px-8 py-8" style={{ marginTop: '60px' }}> <ProfileHeader {...profileHeaderProps} /> <input type="file" ref={fileInputRef} style={{ display: 'none' }} accept="image/*" onChange={handleFileChange} /> <div className="w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-8"> <div className="flex-grow flex flex-col gap-8"> <StatisticsCard {...statsCardProps} /> <div className="card h-full"> <h2 className="card-header text-white">Achievements</h2> {featuredAchievements.map((achievement) => <AchievementCard key={achievement.id} {...achievement} />)} <button onClick={() => setActiveView('allAchievements')} className="block text-[#c74ece] text-center font-semibold mt-4 hover:underline bg-transparent border-none cursor-pointer w-full p-0"> View all </button> </div> </div> <div className="w-full lg:w-[350px] flex-shrink-0"> <FriendsPanel following={userData.profile.following} followers={userData.profile.followers} onFindUsersClick={() => setActiveView('findUsers')} onInviteFriendsClick={() => setInviteModalOpen(true)} /> </div> </div> </div> </main>);
                }
            };
            return (<div className="full-page-bg flex"> <Sidebar /> <TopHeader dayStreak={userData.stats.dayStreak} currentCourse={userData.currentCourse} onNotificationClick={handleNotificationClick} showNotifications={showNotifications} notifications={userData.notifications} onReadAllNotifications={handleReadAllNotifications} onCourseChange={handleCourseChange} /> {renderContent()} <InviteFriendsModal isOpen={isInviteModalOpen} onClose={() => setInviteModalOpen(false)} /> </div>);
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProfilePage />);
    </script>
</body>

</html>
