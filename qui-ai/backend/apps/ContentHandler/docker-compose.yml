version: '3.8'

services:
  app:
    build:
      context: .
      args:
        - PYTHONUNBUFFERED=1
    environment:
      - HF_HOME=/app/models
      - PGSSLMODE=require
      - DATABASE_URL=postgresql://postgres:farrahpost@postgres/contenthandlerdb
    ports:
      - "8000:8000"
    mem_limit: 4g
    shm_size: 256mb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_cache:/app/models
      - ./static/uploads:/app/static/uploads
      - ./data:/app/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: farrahpost
      POSTGRES_DB: contenthandlerdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contenthandlerdb"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  model_cache: