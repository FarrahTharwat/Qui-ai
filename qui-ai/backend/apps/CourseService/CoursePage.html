<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUI.AI - Lesson</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style type="text/css">
        @font-face { font-family: 'Madani'; src: url('./Fonts/Madani Arabic Regular.ttf') format('truetype'); }
        @font-face { font-family: 'Madani'; src: url('./Fonts/Madani Arabic Bold.ttf') format('truetype'); font-weight: bold; }
        body { font-family: 'Madani', sans-serif; background-color: #0d001a; color: white; }
        .feedback-banner { transition: all 0.3s ease-in-out; }
        .summary-card { background-color: #1c1c1c; border-bottom-width: 4px; }
        @keyframes twinkle {
            0% { transform: scale(0.5); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.5); opacity: 0.5; }
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation-name: twinkle;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // FINAL, 100% COMPLETE CODE: All components and functions are fully defined to fix all errors.

        const lessonQuestionPool = [ { id: 1, questionText: "Which of the following is primarily used for classifying data?", options: ["Regression", "Clustering", "Decision Tree", "Anomaly Detection"], correctAnswer: "Decision Tree" }, { id: 2, questionText: "What does the 'N' in 'NLP' stand for?", options: ["Network", "Natural", "Neural", "N-dimensional"], correctAnswer: "Natural" }, { id: 3, questionText: "A high learning rate in a model can lead to:", options: ["Faster convergence", "Overshooting the minimum", "Underfitting", "More stable training"], correctAnswer: "Overshooting the minimum" }, { id: 4, questionText: "Which activation function is known for mitigating the vanishing gradient problem?", options: ["Sigmoid", "Tanh", "ReLU", "Softmax"], correctAnswer: "ReLU" }, { id: 5, questionText: "Overfitting occurs when a model:", options: ["Performs well on new data", "Is too simple", "Learns the training data too well", "Has low variance"], correctAnswer: "Learns the training data too well" }, { id: 6, questionText: "What is 'dimensionality reduction'?", options: ["Increasing model parameters", "Reducing the number of input variables", "Training on more data", "A type of deep learning"], correctAnswer: "Reducing the number of input variables" }, { id: 7, questionText: "Which is a common metric for a regression task?", options: ["Accuracy", "F1-Score", "Mean Squared Error (MSE)", "Precision"], correctAnswer: "Mean Squared Error (MSE)" }, ];
        const createNodes = (startIndex) => Array.from({ length: 5 }, (_, i) => ({ id: `l${startIndex + i}`, type: 'lesson', title: `Lesson ${startIndex + i}`, side: (i % 2 === 0) ? 'left' : 'right' }));
        const allCoursesData = { "Neural Networks": { courseTitle: "Neural Networks: From Scratch to Frameworks", sections: [ { id: "nn_s1", unit: "SECTION 1", title: "Foundations of NN", nodes: createNodes(1) }, { id: "nn_s2", unit: "SECTION 2", title: "Convolutional Networks (CNN)", nodes: createNodes(6) }, { id: "nn_s3", unit: "SECTION 3", title: "Recurrent Networks (RNN)", nodes: createNodes(11) }, { id: "nn_s4", unit: "SECTION 4", title: "Advanced Architectures", nodes: createNodes(16) } ] }, "Computer Vision": { courseTitle: "Computer Vision with Python", sections: [ { id: "cv_s1", unit: "SECTION 1", title: "Image Fundamentals", nodes: createNodes(1) }, { id: "cv_s2", unit: "SECTION 2", title: "Feature Detection", nodes: createNodes(6) }, { id: "cv_s3", unit: "SECTION 3", title: "Object Recognition", nodes: createNodes(11) }, { id: "cv_s4", unit: "SECTION 4", title: "Video Analysis", nodes: createNodes(16) } ] }, "Machine Learning": { courseTitle: "The Machine Learning Course", sections: [ { id: "ml_s1", unit: "SECTION 1", title: "Core Concepts", nodes: createNodes(1) }, { id: "ml_s2", unit: "SECTION 2", title: "Supervised Learning", nodes: createNodes(6) }, { id: "ml_s3", unit: "SECTION 3", title: "Unsupervised Learning", nodes: createNodes(11) }, { id: "ml_s4", unit: "SECTION 4", title: "Model Deployment", nodes: createNodes(16) } ] }, "Cloud": { courseTitle: "Cloud Computing Essentials", sections: [ { id: "c_s1", unit: "SECTION 1", title: "Intro to Cloud", nodes: createNodes(1) }, { id: "c_s2", unit: "SECTION 2", title: "IaaS, PaaS, SaaS", nodes: createNodes(6) }, { id: "c_s3", unit: "SECTION 3", title: "Virtualization & Containers", nodes: createNodes(11) }, { id: "c_s4", unit: "SECTION 4", title: "Cloud Security", nodes: createNodes(16) } ] }, "Deep Learning": { courseTitle: "Deep Learning Specialization", sections: [ { id: "dl_s1", unit: "SECTION 1", title: "Hyperparameter Tuning", nodes: createNodes(1) }, { id: "dl_s2", unit: "SECTION 2", title: "Optimization Algorithms", nodes: createNodes(6) }, { id: "dl_s3", unit: "SECTION 3", title: "TensorFlow & PyTorch", nodes: createNodes(11) }, { id: "dl_s4", unit: "SECTION 4", title: "Generative Models", nodes: createNodes(16) } ] }, "NLP": { courseTitle: "Natural Language Processing", sections: [ { id: "nlp_s1", unit: "SECTION 1", title: "Text Processing", nodes: createNodes(1) }, { id: "nlp_s2", unit: "SECTION 2", "title": "Embeddings & Semantics", nodes: createNodes(6) }, { id: "nlp_s3", unit: "SECTION 3", title: "Sequence Models", nodes: createNodes(11) }, { id: "nlp_s4", unit: "SECTION 4", title: "Transformers & BERT", nodes: createNodes(16) } ] }, "Robotics": { courseTitle: "Modern Robotics", sections: [ { id: "r_s1", unit: "SECTION 1", title: "Robot Kinematics", nodes: createNodes(1) }, { id: "r_s2", unit: "SECTION 2", title: "Dynamics and Control", nodes: createNodes(6) }, { id: "r_s3", unit: "SECTION 3", title: "Motion Planning", nodes: createNodes(11) }, { id: "r_s4", unit: "SECTION 4", title: "Robot Vision", nodes: createNodes(16) } ] } };

        const StarsBackground = () => (
            <div className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
                <span className="star" style={{width: '2px', height: '2px', top: '10%', left: '15%', animationDuration: '3s'}}></span>
                <span className="star" style={{width: '1px', height: '1px', top: '25%', left: '25%', animationDuration: '4s', animationDelay: '1s'}}></span>
                <span className="star" style={{width: '3px', height: '3px', top: '5%', left: '50%', animationDuration: '2.5s'}}></span>
                <span className="star" style={{width: '1px', height: '1px', top: '40%', left: '65%', animationDuration: '5s', animationDelay: '0.5s'}}></span>
                <span className="star" style={{width: '2px', height: '2px', top: '60%', left: '85%', animationDuration: '3.5s'}}></span>
                <span className="star" style={{width: '3px', height: '3px', top: '80%', left: '95%', animationDuration: '2s', animationDelay: '1.5s'}}></span>
                <span className="star" style={{width: '1px', height: '1px', top: '90%', left: '55%', animationDuration: '4.5s'}}></span>
                <span className="star" style={{width: '2px', height: '2px', top: '75%', left: '20%', animationDuration: '3s', animationDelay: '2s'}}></span>
            </div>
        );

        const LessonStartScreen = ({ onStart, sectionUnit, sectionTitle, lessonNumber }) => (
            <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                <a href="HomePage.html" className="absolute top-6 left-6 text-xl text-gray-400 hover:text-white">&larr; {sectionUnit}</a>
                <div className="relative mb-8">
                    <i className="fas fa-star text-9xl text-green-400"></i>
                </div>
                <div className="bg-green-500 text-white p-6 rounded-xl w-full max-w-md text-center">
                    <h1 className="text-2xl font-bold">{sectionTitle}</h1>
                    <p className="text-green-200 mb-6">Lesson {lessonNumber} of 5</p>
                    <button onClick={onStart} className="w-full bg-white text-green-500 font-bold py-3 rounded-lg text-lg uppercase hover:bg-gray-200 transition">
                        Start +10 XP
                    </button>
                </div>
            </div>
        );

        const LessonCompleteScreen = ({ time, accuracy }) => (
            <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center bg-gradient-to-b from-[#3c0089] to-[#0d001a]">
                <img src="images/great-job-01.png" alt="Great Job Robot" className="w-64 h-auto mb-4" />
                <h1 className="text-5xl font-bold text-white mb-8">Lesson complete!</h1>
                <div className="grid grid-cols-3 gap-4 w-full max-w-2xl mb-8">
                    <div className="summary-card border-pink-500 p-4 rounded-xl">
                        <p className="font-bold text-pink-500">TOTAL XP</p>
                        <p className="text-3xl font-bold">14</p>
                    </div>
                    <div className="summary-card border-purple-500 p-4 rounded-xl">
                        <p className="font-bold text-purple-500">QUICK</p>
                        <p className="text-3xl font-bold">{time}</p>
                    </div>
                    <div className="summary-card border-indigo-500 p-4 rounded-xl">
                        <p className="font-bold text-indigo-500">GREAT</p>
                        <p className="text-3xl font-bold">{accuracy}%</p>
                    </div>
                </div>
                <a href="HomePage.html" className="w-full max-w-2xl bg-[#c74ece] text-white font-bold py-4 rounded-xl text-lg uppercase hover:bg-[#b035dd] transition">
                    Continue
                </a>
            </div>
        );

        const EncouragementPopup = () => {
            const messages = ["Great job!", "You're on fire!", "Awesome!", "Keep it up!", "Incredible!"];
            const [message, setMessage] = React.useState('');
            React.useEffect(() => { setMessage(messages[Math.floor(Math.random() * messages.length)]); }, []);
            return (
                <div className="fixed bottom-4 left-4 flex items-center gap-4 bg-[#1c1c1c] p-4 rounded-2xl shadow-lg border-2 border-purple-500 transition-all duration-500 transform animate-[bounce_1s_ease-in-out] z-50">
                    <img src="images/Robot-Logo-Empty-01.png" alt="Encouragement Robot" className="w-20 h-20"/>
                    <p className="text-2xl font-bold text-white">{message}</p>
                </div>
            );
        };

        const TopBar = ({ progress, lives }) => (
            <div className="w-full flex items-center gap-4 p-4">
                <a href="HomePage.html" className="text-gray-400 text-2xl hover:text-white"> <i className="fas fa-times"></i> </a>
                <div className="w-full bg-gray-700 rounded-full h-4">
                    <div className="bg-gradient-to-r from-pink-500 to-purple-500 h-4 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                </div>
                <div className="flex items-center gap-2">
                    <i className="fas fa-heart text-red-500 text-2xl"></i>
                    <span className="font-bold text-xl">{lives}</span>
                </div>
            </div>
        );

        const QuestionCard = ({ question, onSelectAnswer, selectedAnswer }) => {
            const buttonColors = [ "border-pink-500 hover:bg-pink-500/20", "border-purple-500 hover:bg-purple-500/20", "border-indigo-500 hover:bg-indigo-500/20", "border-teal-500 hover:bg-teal-500/20", ];
            return (
                <div className="w-full max-w-2xl mx-auto flex-grow flex flex-col justify-center px-4">
                    <h2 className="text-3xl font-bold mb-8 bg-gradient-to-r from-pink-400 to-purple-400 text-transparent bg-clip-text">
                        {question.questionText}
                    </h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {question.options.map((option, index) => (
                            <button key={index} onClick={() => onSelectAnswer(option)} className={`p-4 text-left font-semibold border-2 rounded-lg transition-all duration-200 ${selectedAnswer === option ? 'bg-[#c74ece] border-[#c74ece] scale-105' : `bg-gray-800/50 ${buttonColors[index]}`}`}>
                                {option}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const FeedbackFooter = ({ status, correctAnswer, onContinue }) => {
            const isCorrect = status === 'correct';
            return (
                <div className={`feedback-banner w-full p-4 ${isCorrect ? "bg-green-500" : "bg-red-500"}`}>
                    <div className="w-full max-w-2xl mx-auto flex justify-between items-center">
                        <div className="font-bold text-xl">{isCorrect ? "Excellent!" : `Correct answer: ${correctAnswer}`}</div>
                        <button onClick={onContinue} className="bg-white text-black font-bold py-2 px-8 rounded-lg hover:bg-gray-200">CONTINUE</button>
                    </div>
                </div>
            );
        };

        const ActionFooter = ({ onCheck, onSkip, selectedAnswer }) => (
            <div className="w-full p-4 border-t-2 border-gray-700">
                <div className="w-full max-w-2xl mx-auto flex gap-4">
                    <button onClick={onSkip} className="w-1/3 py-3 font-bold rounded-lg transition-all duration-200 bg-gray-600 hover:bg-gray-500">SKIP</button>
                    <button onClick={onCheck} disabled={!selectedAnswer} className="w-2/3 py-3 font-bold rounded-lg transition-all duration-200 bg-[#c74ece] text-white disabled:bg-gray-700 disabled:text-gray-500 disabled:cursor-not-allowed hover:enabled:bg-[#b035dd]">CHECK</button>
                </div>
            </div>
        );

        const CoursePage = () => {
            const [lessonState, setLessonState] = React.useState('not_started');
            const [userData, setUserData] = React.useState(null);
            const [lessonInfo, setLessonInfo] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [wrongAnswers, setWrongAnswers] = React.useState([]);
            const [correctCount, setCorrectCount] = React.useState(0);
            const [selectedAnswer, setSelectedAnswer] = React.useState(null);
            const [answerStatus, setAnswerStatus] = React.useState('unanswered');
            const [lessonStats, setLessonStats] = React.useState({ startTime: 0, totalAttempts: 0, correctAnswers: 0 });
            const [showEncouragement, setShowEncouragement] = React.useState(false);

            React.useEffect(() => {
                const storedUserData = localStorage.getItem('Q.Ai_userData');
                if (storedUserData) {
                    const parsedData = JSON.parse(storedUserData);
                    setUserData(parsedData);
                    const courseName = parsedData.currentCourse;
                    const lessonsCompleted = parsedData.progress[courseName] || 0;
                    if (allCoursesData[courseName]) {
                        const currentCourseData = allCoursesData[courseName];
                        const lessonsPerSection = 5;
                        const currentSectionIndex = Math.floor(lessonsCompleted / lessonsPerSection);
                        if (currentCourseData.sections[currentSectionIndex]) {
                            const currentSection = currentCourseData.sections[currentSectionIndex];
                            const lessonNumberInSection = (lessonsCompleted % lessonsPerSection) + 1;
                            setLessonInfo({
                                sectionUnit: currentSection.unit,
                                sectionTitle: currentSection.title,
                                lessonNumber: lessonNumberInSection
                            });
                        }
                    }
                }
                setQuestions([...lessonQuestionPool].sort(() => 0.5 - Math.random()).slice(0, 7));
            }, []);

            const updateStreak = (currentUserData) => {
                const today = new Date();
                const todayString = today.toISOString().split('T')[0];
                const lastDateString = currentUserData.stats.lastLessonDate;
                if (lastDateString === todayString) return currentUserData;
                const updatedStats = { ...currentUserData.stats };
                if (!lastDateString) {
                    updatedStats.dayStreak = 1;
                } else {
                    const lastDate = new Date(lastDateString);
                    const diffTime = today - lastDate;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    if (diffDays === 1) {
                        updatedStats.dayStreak += 1;
                    } else if (diffDays > 1) {
                        updatedStats.dayStreak = 1;
                    }
                }
                updatedStats.lastLessonDate = todayString;
                return { ...currentUserData, stats: updatedStats };
            };

            const handleLessonComplete = () => {
                const finalUserData = updateStreak(userData);
                finalUserData.progress[finalUserData.currentCourse] += 1;
                localStorage.setItem('Q.Ai_userData', JSON.stringify(finalUserData));
                const endTime = Date.now();
                const timeTaken = Math.round((endTime - lessonStats.startTime) / 1000);
                const minutes = Math.floor(timeTaken / 60);
                const seconds = timeTaken % 60;
                const accuracy = lessonStats.totalAttempts > 0 ? Math.round((lessonStats.correctAnswers / lessonStats.totalAttempts) * 100) : 100;
                setLessonStats(prev => ({ ...prev, time: `${minutes}:${seconds.toString().padStart(2, '0')}`, accuracy: accuracy }));
                setLessonState('completed');
            };

            const handleStartLesson = () => {
                setLessonStats({ ...lessonStats, startTime: Date.now() });
                setLessonState('in_progress');
            };

            const updateLives = (newLives) => {
                if (!userData) return;
                const updatedData = { ...userData, stats: { ...userData.stats, lives: newLives } };
                setUserData(updatedData);
                localStorage.setItem('Q.Ai_userData', JSON.stringify(updatedData));
            };

            const handleCheckAnswer = () => {
                setLessonStats(prev => ({...prev, totalAttempts: prev.totalAttempts + 1 }));
                if (selectedAnswer === questions[0].correctAnswer) {
                    setAnswerStatus('correct');
                    setLessonStats(prev => ({...prev, correctAnswers: prev.correctAnswers + 1 }));
                    if (Math.random() < 0.35) {
                        setShowEncouragement(true);
                        setTimeout(() => { setShowEncouragement(false); }, 2500);
                    }
                } else {
                    setAnswerStatus('incorrect');
                    updateLives(userData.stats.lives - 1);
                    setWrongAnswers(prev => [...prev, questions[0]]);
                }
            };
            
            const handleContinue = () => {
                if(answerStatus === 'correct') {
                    setCorrectCount(prev => prev + 1);
                }
                setQuestions(prev => prev.slice(1));
                setSelectedAnswer(null);
                setAnswerStatus('unanswered');
            };

            const handleSkip = () => {
                setQuestions(prev => [...prev.slice(1), prev[0]]);
            };
            
            React.useEffect(() => {
                if (correctCount === 5) {
                    if (wrongAnswers.length > 0) {
                        setQuestions(wrongAnswers);
                        setWrongAnswers([]);
                    } else {
                        handleLessonComplete();
                    }
                }
            }, [correctCount, wrongAnswers]);
            
            if (!userData || !lessonInfo) { return <div className="flex items-center justify-center min-h-screen">Loading...</div>; }
            if (lessonState === 'not_started') { return <LessonStartScreen onStart={handleStartLesson} sectionUnit={lessonInfo.sectionUnit} sectionTitle={lessonInfo.sectionTitle} lessonNumber={lessonInfo.lessonNumber}/>; }
            if (lessonState === 'completed') { return <LessonCompleteScreen time={lessonStats.time} accuracy={lessonStats.accuracy} />; }
            if (userData.stats.lives <= 0) { return (<div className="min-h-screen flex flex-col items-center justify-center text-white bg-red-900"> <i className="fas fa-heart-broken text-8xl text-red-400 mb-8"></i> <h1 className="text-4xl font-bold mb-4">You ran out of lives!</h1> <p className="text-xl text-red-200 mb-8">Practice some more to earn lives back.</p> <a href="HomePage.html" className="bg-white text-black font-bold py-3 px-10 rounded-lg text-lg hover:bg-gray-200">RETURN HOME</a> </div>); }
            
            const progress = (correctCount / 5) * 100;
            const currentQuestion = questions.length > 0 ? questions[0] : null;

            return (
                <div className="relative min-h-screen">
                    <StarsBackground />
                    <div className="relative z-10 flex flex-col min-h-screen">
                        {showEncouragement && <EncouragementPopup />}
                        {currentQuestion ? (
                            <>
                                <TopBar progress={progress} lives={userData.stats.lives} />
                                <QuestionCard question={currentQuestion} selectedAnswer={selectedAnswer} onSelectAnswer={(option) => answerStatus === 'unanswered' && setSelectedAnswer(option)} />
                                {answerStatus !== 'unanswered' ? ( <FeedbackFooter status={answerStatus} correctAnswer={currentQuestion.correctAnswer} onContinue={handleContinue} /> ) : ( <ActionFooter onCheck={handleCheckAnswer} onSkip={handleSkip} selectedAnswer={selectedAnswer} /> )}
                            </>
                        ) : (
                            <div className="flex-grow flex items-center justify-center">
                                <h2 className="text-2xl">Calculating results...</h2>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<CoursePage />);
    </script>
</body>
</html>
