version: "3.9"

services:
  track_progress:
    build: ./track_progress
    container_name: track_progress
    env_file:
      - ./track_progress/.env
    ports:
      - "8001:8000"  # Exposed on host as :8001
    environment:
      XP_SERVICE_URL: http://xp_points:8000  # Internal service URL
    depends_on:
      - xp_points
    networks:
      - appnet

  xp_points:
    build: ./xp_points
    container_name: xp_points
    env_file:
      - ./xp_points/.env
    ports:
      - "8002:8000"  # Exposed on host as :8002
    environment:
      ACHIEVEMENT_URL: http://achievements:8000  # Internal service URL
    depends_on:
      - achievements
    networks:
      - appnet

  achievements:
    build: ./achievements
    container_name: achievements
    env_file:
      - ./achievements/.env
    ports:
      - "8003:8000"  # Exposed on host as :8003
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
