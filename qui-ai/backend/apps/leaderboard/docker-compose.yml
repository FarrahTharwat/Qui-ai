version: '3.8'

services:
  # Main FastAPI Application
  leaderboard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaderboard-api
    ports:
      - "8000:8000"
    environment:
      # Database Configuration (Supabase)
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-5432}

      # Redis Configuration (Redis Cloud)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USERNAME=${REDIS_USERNAME:-default}
      - REDIS_SSL=${REDIS_SSL:-false}
      - REDIS_URL=${REDIS_URL}

      # Celery Configuration
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}

      # Application Configuration
      - TRACKING_SERVICE_URL=${TRACKING_SERVICE_URL}
      - SQL_ECHO=${SQL_ECHO:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    depends_on:
      - redis-local
    networks:
      - leaderboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker (Optional - for background tasks)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      # Same environment variables as main app
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USERNAME=${REDIS_USERNAME:-default}
      - REDIS_SSL=${REDIS_SSL:-false}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    depends_on:
      - redis-local
      - leaderboard-api
    networks:
      - leaderboard-network
    restart: unless-stopped

  # Local Redis (Optional - for development)
  redis-local:
    image: redis:7-alpine
    container_name: redis-local
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass localredispass
    volumes:
      - redis-data:/data
    networks:
      - leaderboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localredispass", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: leaderboard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - leaderboard-api
    networks:
      - leaderboard-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis-data:
    driver: local

networks:
  leaderboard-network:
    driver: bridge