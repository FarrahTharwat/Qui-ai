version: '3.8'

services:
  fastapi-app:
    build: .
    container_name: backend-fastapi-app
    working_dir: /apps/backend/apps/leaderboard
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/apps/backend
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD="dummy_password"  # Required for Docker
      - REDIS_URL=rediss://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
      - CELERY_BROKER_URL=rediss://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/leaderboard:/apps/backend/apps/leaderboard
    env_file:
      - .env

  backend-worker:
    user: "1000:1000"
    build: .
    container_name: backend-worker
    working_dir: /apps/backend/apps/leaderboard
    environment:
      - PYTHONPATH=/apps/backend
      - CELERY_BROKER_URL=rediss://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    command: ["celery", "-A", "Celery:celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./apps/leaderboard:/apps/backend/apps/leaderboard
    env_file:
      - .env

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6380:6380"
    command: redis-server --requirepass ${REDIS_PASSWORD} --port 6380
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=dummy_password  # Critical fix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: