<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style type="text/css">
        @font-face {
            font-family: 'Madani';
            src: url('./Fonts/Madani Arabic Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Madani';
            src: url('./Fonts/Madani Arabic Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Madani', sans-serif;
        }

        input,
        button,
        p,
        h1,
        span,
        a,
        svg,
        i {
            font-family: 'Madani', sans-serif;
        }
        .error-message-placeholder {
            min-height: 1.25rem; 
        }
        .icon-container span i {
             height: 1.25rem; 
             width: 1.25rem;
             display: inline-flex;
             align-items: center;
             justify-content: center;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        // Helper component for input fields - DEFINED OUTSIDE SignUpForm
        const FormField = ({ fieldRef, type, name, value, placeholder, onChange, onKeyPress, error, iconClass, isPassword, show, toggleShow, hint }) => (
            <div>
                <div className="relative icon-container">
                    <input
                        ref={fieldRef}
                        type={type}
                        name={name}
                        value={value}
                        onChange={onChange}
                        onKeyPress={onKeyPress}
                        placeholder={placeholder}
                        className={`w-full p-3 bg-white bg-opacity-20 text-white placeholder-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c74ece] ${iconClass || isPassword ? 'pr-10 sm:pr-12' : ''}`}
                        aria-invalid={!!error}
                        aria-describedby={error ? `${name}-error` : undefined}
                    />
                    {(iconClass || isPassword) && (
                        <span
                            className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-300"
                            style={isPassword ? { cursor: 'pointer', zIndex: 10 } : { pointerEvents: 'none' }}
                            onClick={isPassword ? toggleShow : undefined}
                        >
                            {isPassword ? (show ? <i className="fas fa-eye-slash"></i> : <i className="fas fa-eye"></i>) : <i className={iconClass}></i>}
                        </span>
                    )}
                </div>
                {hint && !error && <p className="text-gray-400 text-xs mt-1 px-1">{hint}</p>}
                <p id={`${name}-error`} className={`text-red-400 text-sm mt-1 error-message-placeholder ${error ? 'opacity-100' : 'opacity-0'}`}>
                    {error || ''}
                </p>
            </div>
        );

        const SignUpForm = () => {
            const [formData, setFormData] = React.useState({
                age: '',
                fullName: '',
                username: '',
                email: '',
                password: '',
                confirmPassword: ''
            });
            const [errors, setErrors] = React.useState({});
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const [showPassword, setShowPassword] = React.useState(false);
            const [showConfirmPassword, setShowConfirmPassword] = React.useState(false);

            const ageRef = React.useRef(null);
            const fullNameRef = React.useRef(null);
            const usernameRef = React.useRef(null);
            const emailRef = React.useRef(null);
            const passwordRef = React.useRef(null);
            const confirmPasswordRef = React.useRef(null);

            const fieldRefs = { 
                age: ageRef,
                fullName: fullNameRef,
                username: usernameRef,
                email: emailRef,
                password: passwordRef,
                confirmPassword: confirmPasswordRef
            };

            const validateField = (name, value, currentFullFormData) => {
                let errorMsg = '';
                const dataToValidate = currentFullFormData || formData;

                switch (name) {
                    case 'age':
                        if (!value || isNaN(value) || Number(value) < 1) {
                            errorMsg = 'Please enter a valid age';
                        }
                        break;
                    case 'fullName':
                        if (!value || String(value).trim() === '') {
                            errorMsg = 'Please enter your full name';
                        }
                        break;
                    case 'username':
                        if (!value || String(value).trim() === '') {
                            errorMsg = 'Please enter a username';
                        }
                        break;
                    case 'email':
                        if (!value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value))) {
                            errorMsg = 'Please enter a valid email address';
                        }
                        break;
                    case 'password':
                        const valStr = String(value);
                        if (!valStr || valStr.length < 8 ||
                            !/[A-Z]/.test(valStr) ||
                            !/[a-z]/.test(valStr) ||
                            !/[0-9]/.test(valStr) ||
                            !/[!@#$%^&*()]/.test(valStr)
                        ) {
                            errorMsg = 'Password must be at least 8 characters long and include uppercase, lowercase, number, and a special character.';
                        }
                        break;
                    case 'confirmPassword':
                        if (String(value) !== dataToValidate.password) {
                            errorMsg = 'Passwords do not match';
                        }
                        if (!value && dataToValidate.password) {
                            errorMsg = 'Please confirm your password.';
                        }
                        break;
                    default:
                        break;
                }
                setErrors(prevErrors => ({ ...prevErrors, [name]: errorMsg }));
                return errorMsg === '';
            };
            
            const validateFormOnSubmit = () => {
                let isFormValid = true;
                for (const fieldName in formData) {
                    if (!validateField(fieldName, formData[fieldName], formData)) {
                        isFormValid = false;
                    }
                }
                return isFormValid;
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                const updatedFormData = { ...formData, [name]: value };
                setFormData(updatedFormData); 
                validateField(name, value, updatedFormData);

                if (name === 'password') {
                    validateField('confirmPassword', updatedFormData.confirmPassword, updatedFormData);
                }
            };

            const handleKeyPress = (e, nextFieldRef) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (nextFieldRef && nextFieldRef.current) {
                        nextFieldRef.current.focus();
                    } else {
                        handleSubmit(e); 
                    }
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setIsSubmitting(true); 

                if (validateFormOnSubmit()) { 
                    console.log('Account created successfully!', formData);
                    alert('Account created successfully!');
                    window.location.href = 'Login.html'; 
                } else {
                    setIsSubmitting(false); 
                    setTimeout(() => {
                        const currentErrors = errors; 
                        const firstErrorField = Object.keys(fieldRefs).find(fieldName => currentErrors[fieldName]);
                        if (firstErrorField && fieldRefs[firstErrorField] && fieldRefs[firstErrorField].current) {
                            fieldRefs[firstErrorField].current.focus();
                        }
                    }, 0);
                }
            };

            return (
                <div className="min-h-screen relative flex items-center justify-center bg-gradient-to-br from-[#3c0089] via-black to-[#c74ece] px-4 sm:px-6 lg:px-8">
                    <div className="absolute top-0 w-full flex justify-between items-center px-4 sm:px-6 lg:px-8 py-4">
                        <span className="text-white text-3xl font-bold">QUI.Ai</span>
                        <a
                            href="Login.html"
                            className="bg-white text-[#c74ece] font-semibold py-2 px-6 rounded-full hover:bg-purple-100 transition duration-300"
                        >
                            LOGIN
                        </a>
                    </div>

                    <div className="flex flex-col items-center justify-center w-full max-w-md sm:max-w-lg lg:max-w-xl py-8">
                        <h1 className="text-white text-3xl font-bold mb-10 mt-16 text-center">Create your profile</h1>
                        <form onSubmit={handleSubmit} className="bg-white bg-opacity-10 p-8 rounded-lg w-full max-w-md" noValidate>
                            <div className="space-y-2"> {/* Input fields container */}
                                <FormField
                                    fieldRef={ageRef} type="number" name="age" value={formData.age} placeholder="Age"
                                    onChange={handleChange} onKeyPress={(e) => handleKeyPress(e, fullNameRef)} error={errors.age}
                                />
                                <FormField
                                    fieldRef={fullNameRef} type="text" name="fullName" value={formData.fullName} placeholder="Full Name"
                                    onChange={handleChange} onKeyPress={(e) => handleKeyPress(e, usernameRef)} error={errors.fullName}
                                />
                                <FormField
                                    fieldRef={usernameRef} type="text" name="username" value={formData.username} placeholder="Username"
                                    onChange={handleChange} onKeyPress={(e) => handleKeyPress(e, emailRef)} error={errors.username}
                                />
                                <FormField
                                    fieldRef={emailRef} type="email" name="email" value={formData.email} placeholder="Email"
                                    onChange={handleChange} onKeyPress={(e) => handleKeyPress(e, passwordRef)} error={errors.email}
                                    iconClass="fas fa-envelope" hint="Example: Name.Surename@gmail.com"
                                />
                                 <FormField
                                    fieldRef={passwordRef} type={showPassword ? 'text' : 'password'} name="password" value={formData.password} placeholder="Password"
                                    onChange={handleChange} onKeyPress={(e) => handleKeyPress(e, confirmPasswordRef)} error={errors.password}
                                    isPassword={true} show={showPassword} toggleShow={() => setShowPassword(!showPassword)}
                                    hint="Password must be at least 8 characters long and include uppercase, lowercase, number, and a special character."
                                />
                                <FormField
                                    fieldRef={confirmPasswordRef} type={showConfirmPassword ? 'text' : 'password'} name="confirmPassword" value={formData.confirmPassword} placeholder="Confirm Password"
                                    onChange={handleChange} onKeyPress={(e) => handleKeyPress(e, null)} error={errors.confirmPassword}
                                    isPassword={true} show={showConfirmPassword} toggleShow={() => setShowConfirmPassword(!showConfirmPassword)}
                                />
                            </div> {/* End of input fields container */}
                            
                            {/* Buttons and OR separator container */}
                            <div className="space-y-4 mt-6">
                                <button
                                    type="submit"
                                    disabled={isSubmitting}
                                    className={`w-full py-3 bg-[#c74ece] text-white font-semibold rounded-lg transition-all duration-300 transform ${
                                        isSubmitting 
                                            ? 'scale-95 bg-[#ac3cbf] opacity-70 cursor-not-allowed' 
                                            : 'hover:scale-105 hover:bg-[#b035dd]'
                                    }`}
                                >
                                    {isSubmitting ? 'CREATING ACCOUNT...' : 'CREATE ACCOUNT'}
                                </button>

                                <div className="flex items-center"> {/* OR separator */}
                                    <div className="flex-grow h-px bg-white opacity-30"></div>
                                    <span className="mx-4 text-white opacity-70">OR</span>
                                    <div className="flex-grow h-px bg-white opacity-30"></div>
                                </div>

                                <button
                                    type="button"
                                    className="w-full py-3 flex items-center justify-center bg-white text-gray-800 font-semibold rounded-lg hover:bg-gray-100 transition duration-300"
                                    onClick={() => alert('Sign up with Google (functionality to be implemented)')}
                                    disabled={isSubmitting}
                                >
                                    <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google logo" className="h-5 w-5 mr-2" />
                                    Sign up with Google
                                </button>
                            </div> {/* End of buttons and OR separator container */}
                        </form> 
                        <div className="text-center mt-6"> {/* Changed from flex items-center to text-center for T&C links */}
                            <p className="text-white text-sm opacity-70">
                                By signing up to QUI.Ai, you agree to our{' '} {/* Changed "signing in" to "signing up" */}
                                <a href="Terms.html" className="underline">Terms</a> and{' '}
                                <a href="Privacy.html" className="underline">Privacy Policy</a>.
                            </p>
                            <p className="text-white text-sm opacity-70 mt-2">
                                This site is protected by reCAPTCHA Enterprise and the{' '}
                                <a href="#" className="underline">Google Privacy Policy</a> and{' '}
                                <a href="#" className="underline">Terms of Service</a> apply.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SignUpForm />);
    </script>
</body>
</html>
